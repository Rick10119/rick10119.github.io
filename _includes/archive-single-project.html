{% assign project_title = post.title | markdownify | remove: "<p>" | remove: "</p>" %}

<div class="project-card">
  <article class="project-card__inner" itemscope itemtype="http://schema.org/CreativeWork">
    <a class="project-card__image" href="{{ post.url | relative_url }}" aria-label="View {{ project_title | strip_html }}">
      <img src="{{ post.teaser | relative_url }}" alt="{{ post.teaser_alt | default: project_title | strip_html }}">
    </a>

    <div class="project-card__body">
      {% if post.category_label %}
        <p class="project-card__category">{{ post.category_label }}</p>
      {% endif %}

      <h2 class="project-card__title" itemprop="headline">
        <a href="{{ post.url | relative_url }}">{{ project_title }}</a>
      </h2>

      {% if post.excerpt %}
        <p class="project-card__excerpt" itemprop="description">{{ post.excerpt }}</p>
      {% endif %}

      <a class="project-card__link" href="{{ post.url | relative_url }}">View project <span aria-hidden="true">→</span></a>
    </div>
  </article>
</div>
